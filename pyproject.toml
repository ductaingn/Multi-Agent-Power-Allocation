[project]
name = "multi-agent-power-allocation"
version = "1.0.0"
description = "Multi-agent power allocation with DRL"
authors = [{ name = "Duc Tai Nguyen", email = "ductaingn.015203@gmail.com" }]
maintainers = [
  { name = "Duc Tai Nguyen", email = "ductaingn.015203@gmail.com" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "attrs>=25.3.0",
  "pygame>=2.6.1",
  "plotly>=6.2.0",
  "wandb>=0.19.11",
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "torchaudio>=2.6.0",
  "pettingzoo>=1.25.0",
  "tqdm>=4.67.1",
  "rich>=14.1.0",
  "matplotlib>=3.10.6",
  "torchinfo>=1.8.0",
]

[project.scripts]
train_pamarl = "multi_agent_power_allocation.run.train:main"

[tool.uv]
managed = true
package = true

[tool.hatch.build]
exclude = ["src/data/*"]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "torch-cpu" }
torchvision = { index = "torch-cpu" }
torchaudio = { index = "torch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
