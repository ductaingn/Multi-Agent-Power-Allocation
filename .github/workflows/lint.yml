name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.10"
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.10"
          args: format --check
